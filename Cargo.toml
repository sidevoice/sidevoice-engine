[package]
name = "sidevoice-engine"
version = "0.14.0"
edition = "2021"
rust-version = "1.98"
# Shipped through git tags and the npm package, never crates.io (RELEASING.md).
publish = false
license = "Apache-2.0"
repository = "https://github.com/sidevoice/sidevoice-engine"
description = "Sidevoice engine: the local-model catalogue, remote providers, resolver, selector and lifecycle, and the backends that run models"

[lib]
# cdylib: the wasm32 build that becomes the npm package (src/web.rs, `cargo xtask npm`). Native consumers depend on
# the crate as source and get the rlib.
crate-type = ["rlib", "cdylib"]

[dependencies]
async-trait = "=0.1.92"
# One model's calls wait for one another (src/capability.rs), and loads of one build make one model in memory: an
# async mutex that needs no runtime and builds for wasm32 too.
async-lock = "3.4.0"
# Backends register themselves (src/backend/registry.rs). linkme does not compile to wasm32; inventory does.
inventory = "0.3.24"
# The catalogue (src/catalog.rs), compiled in and read once.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Each downloaded file is checked against its digest as it arrives (src/install.rs), on every target.
sha2 = { version = "0.11.0", default-features = false }
# Logging (docs/logging.md in sidevoice/.github-private): the engine emits spans and events and never installs a
# subscriber; the process that runs it does. `secrecy` keeps a provider's key out of every Debug, `url` parses what a
# log line shows of a URL.
tracing = { version = "0.1.44", default-features = false, features = ["std", "attributes"] }
secrecy = "0.10.3"
url = "2.5.8"
# smart-turn's input, Whisper's log-mel features (src/backend/smart_turn.rs), on every target: an FFT of any size in pure
# Rust, which compiles to wasm32 too.
rustfft = "6.4.1"
# How old a remote provider's listing is (src/provider/listing.rs): `std::time::Instant` on native, and the page's
# clock on wasm32, where std has none.
web-time = "1.1.0"

# Which backends a build contains is decided by these tables and one `#![cfg]` per backend file, which must agree: a
# backend whose dependency is missing here does not compile. The libraries listed here are the ones backends link. Heavy engine libraries are meant to be downloaded
# when a model needs them, not linked; sherpa-onnx is linked for now (below). Specific platforms first, then the
# general native one.

# The web build (the npm package): the bridge to JavaScript (src/web.rs), and backends whose engine is a JavaScript
# module.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.106"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
# The page's own APIs the web host and the transformers.js backend use: downloads through `fetch`, read as streams and
# stopped with an AbortController (src/web/host/fetcher.rs); stored files read back as Blobs and handed to
# transformers.js as Responses; an AbortSignal from the page (src/web.rs). OPFS itself is bound by hand
# (src/web/opfs.rs): web-sys has no binding for moving a file.
web-sys = { version = "0.3.106", features = [
  "AbortController",
  "AbortSignal",
  "Blob",
  "EventTarget",
  "Headers",
  "ReadableStream",
  "ReadableStreamDefaultReader",
  "Response",
  "ResponseInit",
  "console",
] }

# macOS on Apple silicon, on top of everything native: MLX, and whisper.cpp with its Metal backend (the same
# dependency as below, with Metal added).
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
whisper-rs = { version = "=0.16.0", features = ["metal"] }

# Every native build: the built-in NativeHost (src/host/native.rs) and archives (src/install/archive.rs). sysinfo
# reads the machine's memory. Downloads go through reqwest, the HTTP client sidevoice-core and the desktop app use,
# at the core's version, its body streamed as it arrives; TLS is rustls (the aws-lc-rs provider, the platform's
# certificate verifier), so nothing links the system's OpenSSL. reqwest needs a Tokio runtime, and so do the native
# engine's futures: archives are unpacked on Tokio's blocking threads. Archives come only with native-only builds
# (sherpa-onnx's release assets): a tar read by `tar`, bzip2-compressed or not (bzip2 in pure Rust, its default
# backend). 0.13.1 is the first reqwest that builds for Android (0.13.0 calls a rustls-platform-verifier function that
# Android lacks): sidevoice-core, which pins the same version, must follow it (sidevoice-engine#133).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bzip2 = "=0.6.1"
futures-core = "0.3.31"
# The ONNX Runtime backend (src/backend/implementations/onnx_runtime.rs): `ort`'s safe API over the ONNX Runtime
# sherpa-onnx already links (below), never a runtime of its own. `ort-sys` is named only to switch its linking off
# (`disable-linking`): it then links and downloads nothing, and `OrtGetApiBase` resolves to the runtime sherpa-onnx links:
# inside its libraries, or on iOS in the shared onnxruntime.framework they load (build.rs, README). `ort` keeps its
# ordinary lazy initialization (no `alternative-backend`): the engine installs no process-wide API, so an app's own use
# of `ort` works the same before and after the engine's. Cargo unifies features, so such an app's `ort` also runs on
# that linked runtime (1.28) rather than link or download one: two ONNX Runtimes could not be linked into one binary
# anyway. API 17 is what it asks of a runtime (1.17 or later).
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "api-17"] }
ort-sys = { version = "=2.0.0-rc.13", default-features = false, features = ["disable-linking"] }
reqwest = { version = "=0.13.1", default-features = false, features = ["rustls", "stream"] }
sysinfo = { version = "=0.39.6", default-features = false, features = ["system"] }
tar = { version = "0.4.46", default-features = false }
tokio = { version = "1.53.2", default-features = false, features = ["rt"] }
# The sherpa-onnx backend (src/backend/implementations/sherpa_onnx.rs): the official crate, pinned exactly. Phase 1
# links it statically: its build script downloads sherpa-onnx's prebuilt static libraries for the target (ONNX
# Runtime included, about 21-23 MB compressed on Linux and macOS, 123 MB on Windows) from the GitHub release of this
# version, and the app carries them (on Android and iOS the crate links shared libraries instead, README). Loading the
# runtime on demand instead is sidevoice-engine#33. Never on wasm32: the web build does not carry it.
sherpa-onnx = { version = "=1.13.8", default-features = false, features = ["static"] }

# Every native build but the phones': the whisper.cpp backend (src/backend/implementations/whisper_cpp.rs).
# `whisper-rs`, pinned exactly (Unlicense; it bundles whisper.cpp's sources, MIT). Phase 1 links it statically, like
# sherpa-onnx: its build script compiles whisper.cpp and ggml with CMake and a C++ compiler, for the CPU (Metal is
# added on Apple silicon, above). Loading it on demand instead is sidevoice-engine#33. Never on wasm32, and not on
# Android, where the on-device speech to text is sherpa-onnx's; iOS has its own table, below, with Metal
# (`platform::local_engines` names both conditions). whisper.cpp tunes ggml for the building machine's CPU unless the
# build's environment sets GGML_NATIVE=OFF, as an app shipping its binary to other machines should (README). With
# sherpa-onnx on Linux x86_64, whisper.cpp must use libstdc++'s old string ABI, as sherpa's libraries do
# (.cargo/config.toml, README).
[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "android"), not(target_os = "ios")))'.dependencies]
whisper-rs = "=0.16.0"

# iOS only: whisper.cpp with its Metal backend (src/backend/implementations/whisper_cpp.rs), the same pinned dependency
# as above, with Metal, in a table of its own so that no other build changes. whisper-rs-sys builds Metal with
# GGML_METAL_EMBED_LIBRARY: the shaders' source is embedded in the binary and compiled when Metal starts, so no
# `.metallib` resource ships with the app. sherpa-onnx's Whisper stays the CPU fallback.
#
# And a floor for `libc`, which no iOS code of the engine names. `sysinfo` 0.39.6 allows `libc` ^0.2.173, and its
# Apple code calls `mach_host_self` and `mach_task_self`, which 0.2.190 lacks for iOS (0.2.191 has them): this makes a
# consuming app's own lock file resolve to a `libc` that compiles, as the engine's does.
[target.'cfg(target_os = "ios")'.dependencies]
libc = "0.2.191"
whisper-rs = { version = "=0.16.0", features = ["metal"] }

# macOS only: the kernel's memory-pressure level (src/platform/memory/macos.rs), which `sysinfo` does not give.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.190"

# macOS and iOS: the memory Metal advises a GPU's working set to stay within (`recommendedMaxWorkingSetSize`,
# src/platform/memory/metal.rs), through objc2's maintained Metal bindings; Metal is a system framework, already
# linked where whisper.cpp runs on it.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2-metal = { version = "0.3.2", default-features = false, features = ["std", "MTLDevice"] }

# Windows only: the hard-link count of a file (src/platform/links/windows.rs), which std exposes only on Unix, the
# graphics adapters the system lists (src/platform/accelerators/windows.rs: DXGI, a system library, no vendor's) and the
# process's ANSI code page (src/platform/narrow_paths/windows.rs).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Graphics_Dxgi"] }
winapi-util = "0.1.11"
windows-sys = { version = "0.61.2", default-features = false, features = ["Win32_Globalization"] }

# The native tests run the engine's futures on one multi-threaded Tokio runtime, as an app does (src/test_support.rs).
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1.53.2", default-features = false, features = ["rt-multi-thread"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3.79"

# Captures the events a test checks (src/provider/api/tests.rs); the engine itself never installs a subscriber.
[dev-dependencies]
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }

[build-dependencies]
cfg_aliases = "0.2.2"


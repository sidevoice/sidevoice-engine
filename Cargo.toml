[package]
name = "sidevoice-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
# Shipped through git tags and the npm package, never crates.io (RELEASING.md).
publish = false
license = "Apache-2.0"
repository = "https://github.com/sidevoice/sidevoice-engine"
description = "Sidevoice engine: the local-model catalogue, resolver, selector and lifecycle, and the backends that run models"

[lib]
# cdylib: the wasm32 build that becomes the npm package (src/web.rs, `cargo xtask npm`). Native consumers depend on
# the crate as source and get the rlib.
crate-type = ["rlib", "cdylib"]

[dependencies]
async-trait = "=0.1.92"
# Backends register themselves (src/backend/registry.rs). linkme does not compile to wasm32; inventory does.
inventory = "0.3.24"
# backends.json (src/backend/runtime.rs), compiled in and read once.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# Which backends a build contains is decided by these tables, the features below and one `#![cfg]` per backend file
# (build.rs). The libraries listed here are the ones backends link. Heavy engine libraries are meant to be downloaded
# when a model needs them, not linked; sherpa-onnx is linked for now (below). Specific platforms first, then the
# general native one.

# The web build (the npm package): the bridge to JavaScript (src/web.rs), and backends whose engine is a JavaScript
# module.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.106"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"

# macOS on Apple silicon, on top of everything native: MLX.
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]

# Every native build.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The sherpa-onnx backend (src/backend/implementations/sherpa_onnx.rs): the official crate, pinned exactly. Phase 1
# links it statically: its build script downloads sherpa-onnx's prebuilt static libraries for the target (ONNX
# Runtime included, about 21-23 MB compressed on Linux and macOS, 123 MB on Windows) from the GitHub release of this
# version, and the app carries them. Loading the runtime on demand instead is sidevoice-engine#33. Never on wasm32:
# the web build does not carry it.
sherpa-onnx = { version = "=1.13.8", default-features = false, features = ["static"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3.79"

# The sherpa-onnx inference tests (src/backend/implementations/sherpa_onnx/inference_tests.rs) download and unpack
# their own models: digests, and the tar.bz2 archives upstream publishes (bzip2 0.6 decodes in Rust, no C).
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
bzip2 = "0.6.1"
sha2 = "0.10.9"
tar = "0.4.46"

[build-dependencies]
cfg_aliases = "0.2.2"

[features]
default = ["sherpa-onnx"]
# The sherpa-onnx backend, and the static libraries it links. Natively only; a build without it has no backend that
# runs a model yet, and is smaller by what CI's `link-size` job reports.
sherpa-onnx = ["dep:sherpa-onnx"]

[package]
name = "sidevoice-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
# Shipped through git tags and the npm package, never crates.io (RELEASING.md).
publish = false
license = "Apache-2.0"
repository = "https://github.com/sidevoice/sidevoice-engine"
description = "Sidevoice engine: the local-model catalogue, resolver, selector and lifecycle, and the backends that run models"

[lib]
# cdylib: the wasm32 build that becomes the npm package (src/web.rs, `cargo xtask npm`). Native consumers depend on
# the crate as source and get the rlib.
crate-type = ["rlib", "cdylib"]

[dependencies]
async-trait = "=0.1.92"
# Backends register themselves (src/backend/registry.rs). linkme does not compile to wasm32; inventory does.
inventory = "0.3.24"
# backends.json (src/backend/runtime.rs), compiled in and read once.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Each downloaded file is checked against its digest as it arrives (src/install.rs), on every target.
sha2 = { version = "0.11.0", default-features = false }
# Archives (src/install/archive.rs): bzip2 in pure Rust (its default backend, libbz2-rs-sys), so it builds for wasm32
# too; the tar format is read by the installer itself, fed as bytes arrive.
bzip2 = "=0.6.1"

# Which backends a build contains is decided by these tables and by one `#![cfg]` per backend file (build.rs). The
# libraries listed here are the ones backends link; heavy engine libraries are downloaded when a model needs them,
# not linked. Specific platforms first, then the general native one.

# The web build (the npm package): the bridge to JavaScript (src/web.rs), and backends whose engine is a JavaScript
# module.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.106"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"

# macOS on Apple silicon, on top of everything native: MLX.
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]

# Every native build: the built-in NativeHost (src/host/native.rs). sysinfo reads the machine's memory. The HTTP client is blocking and runs on a thread
# of its own per download, whose chunks reach the async side through a channel: no async runtime is imposed on the
# app. TLS is rustls with its default provider and the webpki roots, so nothing links the system's OpenSSL.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
async-channel = "2.5.0"
sysinfo = { version = "=0.39.6", default-features = false, features = ["system"] }
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"] }
# sherpa-onnx's C API, opened at run time from the library the installer downloaded (src/backend/implementations/
# sherpa_onnx/library.rs): no backend links its engine at build time.
libloading = "0.9.0"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3.79"

[build-dependencies]
cfg_aliases = "0.2.2"

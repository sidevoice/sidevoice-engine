[package]
name = "xtask"
version = "0.0.0"
edition = "2021"
rust-version = "1.98"
publish = false
description = "Build tooling for the engine: the npm package, the release assets, publishing, the catalogue's pins and the voice loop."

[dependencies]
# preserve_order: `pin-catalog` rewrites the family files with their keys where they were.
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
# `sherpa-libs` unpacks sherpa-onnx's archive itself, as the engine does (the same crates), so that a laptop needs no
# bzip2 tool.
bzip2 = "=0.6.1"
tar = { version = "0.4.46", default-features = false }
# `sherpa-libs --pin` reads the pinned sherpa-onnx crate's config structs to generate the fields a build's files fill.
syn = { version = "2", default-features = false, features = ["full", "parsing"] }

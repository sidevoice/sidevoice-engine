[package]
name = "xtask"
version = "0.0.0"
edition = "2021"
rust-version = "1.98"
publish = false
description = "Build tooling for the engine: the npm package, the release assets, publishing, the catalogue's pins and the voice loop."

[dependencies]
# preserve_order: `pin-catalog` rewrites the family files with their keys where they were.
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
# `cargo xtask e2e` runs the voice loop through the engine's public API, as an app does: only with the `e2e` feature,
# so that the other commands build without the engine (and without the libraries its backends link).
sidevoice-engine = { path = "..", optional = true }
# The runtime the loop runs the engine on: the native engine's downloads (reqwest) need Tokio.
tokio = { version = "1.53.2", default-features = false, features = ["rt-multi-thread"], optional = true }

[features]
default = ["e2e"]
e2e = ["dep:sidevoice-engine", "dep:tokio"]

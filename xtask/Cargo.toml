[package]
name = "xtask"
version = "0.0.0"
edition = "2021"
rust-version = "1.98"
publish = false
description = "Build tooling for the engine: the npm package, the release assets, publishing, the catalogue's pins and the voice loop."

[dependencies]
# The host's OS and CPU names (`linux-x86_64`, `macos-x86_64`, ...) shared with the connector, from a core release tag.
# Only `target`, so no default features: no third-party crate comes with it. Build tooling only; the engine library never
# depends on it. The tag is the core release that carries `target::host()` (sidevoice/sidevoice-core#233); whoever
# releases core and bumps its consumers bumps it here too, as in the connector (which pins v0.16.0).
sidevoice-platform = { git = "https://github.com/sidevoice/sidevoice-core", tag = "v0.17.0", default-features = false }
# preserve_order: `pin-catalog` rewrites the family files with their keys where they were.
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
# npm's `shasum` of a tarball (SHA-1), to tell whether a staged version is this build (`npm-publish`).
sha1 = "0.10"
serde = { version = "1", features = ["derive"] }
# `sherpa-libs` unpacks sherpa-onnx's archive itself, as the engine does (the same crates), so that a laptop needs no
# bzip2 tool.
bzip2 = "=0.6.1"
tar = { version = "0.4.46", default-features = false }
# `sherpa-libs --pin` reads the pinned sherpa-onnx crate's config structs to generate the fields a build's files fill.
syn = { version = "2", default-features = false, features = ["full", "parsing"] }
# Token scanning keeps comments and string contents out of the platform boundary check.
proc-macro2 = { version = "1", features = ["span-locations"] }

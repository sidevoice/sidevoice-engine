name: providers

# What the remote providers' APIs do not say about their models (src/provider/<provider>/facts.json) is derived from
# their official OpenAPI specs; on every pull request it is derived again from the specs as they are now, and must be
# what is written (`cargo xtask pin-providers --check`). A provider that changed its spec in a way that changes the
# facts fails it, whatever the pull request touches: to fix it, run `cargo xtask pin-providers`, review the facts and
# push them. Separate from ci.yml so that the drift reads as what it is.
on:
  # Into any branch, so a pull request stacked on another is checked before its base merges.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: providers-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pinned:
    name: Provider facts pinned
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup
      - run: cargo xtask pin-providers --check
        env:
          # The commits API, for OpenAI's spec: authenticated, the shared runners keep clear of the anonymous limit.
          GITHUB_TOKEN: ${{ github.token }}

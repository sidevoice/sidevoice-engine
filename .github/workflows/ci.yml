name: ci

# Every pull request: format and Clippy (Clippy on macOS too, the only place the MLX backend compiles), the tests on
# every native target and on wasm32 in Node and in a headless Chrome, and the npm package `@sidevoice/engine` built
# and installed as a consumer installs it (`cargo xtask npm`, `npm-smoke`), publishing nothing: what passes here is what merging
# publishes (release.yml). Which backends a build contains is checked here, per target (src/backend/tests.rs, and in the
# packaged build by npm-smoke); whether they work on a given machine is each backend's probe(). Models run for real
# on every native target through the sherpa-onnx backend (test-inference; whisper.cpp runs them in the e2e workflow),
# linked from the libraries `cargo xtask sherpa-libs` fetched and checked (.github/actions/setup), which `sherpa-libs
# --linked` proves. What linking each backend's engine costs is link-size.yml's.
on:
  # Into any branch, so a pull request stacked on another is checked before its base merges.
  pull_request:
  # release-please.yml dispatches it on the release PR, whose pushes start no workflow.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup
        with:
          wasm: true
      - run: cargo fmt --check
      - run: cargo fmt --manifest-path xtask/Cargo.toml --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked --all-targets --target wasm32-unknown-unknown -- -D warnings
      - run: cargo clippy --locked --manifest-path xtask/Cargo.toml --all-targets -- -D warnings

  # A second lint only because the MLX backend compiles on macOS on Apple silicon alone (src/backends/mlx.rs): Clippy
  # on Linux never sees it. Everything else is linted once, above.
  lint-macos:
    name: Lint (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup
      - run: cargo clippy --locked --all-targets -- -D warnings

  test-native:
    name: Test native (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: macos-aarch64, runner: macos-14 }
          - { target: linux-x86_64, runner: ubuntu-24.04 }
          - { target: linux-aarch64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup
      # --include-ignored: the tests that need the network (a real download through NativeHost) run here too; the ones
      # that run real models have jobs of their own: test-inference below, and the voice loop (e2e.yml).
      - run: cargo test --locked -- --include-ignored --skip sherpa_onnx::inference_tests --skip the_voice_loop
      - run: cargo xtask sherpa-libs --linked

  # Real models through the sherpa-onnx backend: Whisper transcribes, Kokoro speaks, and Whisper hears Kokoro back
  # (src/backend/implementations/sherpa_onnx/inference_tests.rs), on the library the build links. The tests download
  # the models themselves, checked by digest; the cache only spares the download, keyed by the file that pins them.
  test-inference:
    name: Test inference (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: macos-aarch64, runner: macos-14 }
          - { target: linux-x86_64, runner: ubuntu-24.04 }
          - { target: linux-aarch64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/test-models
          key: test-models-${{ matrix.target }}-${{ hashFiles('src/backend/implementations/sherpa_onnx/inference_tests.json') }}
      - run: cargo test --locked --lib sherpa_onnx::inference_tests -- --include-ignored --nocapture --test-threads=1
        env:
          SIDEVOICE_TEST_MODELS: ${{ runner.temp }}/test-models
      - run: cargo xtask sherpa-libs --linked

  test-wasm:
    name: Test wasm (Node, npm package)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup
        with:
          wasm: true
      # The build tooling's own tests (xtask/), then the engine's tests compiled to wasm32 and run in Node by
      # wasm-bindgen-test-runner (the runner in .cargo/config.toml; doctests cannot run on wasm32).
      - run: cargo test --locked --manifest-path xtask/Cargo.toml
      - run: cargo test --locked --target wasm32-unknown-unknown --lib
      # The npm package, installed into a temporary directory as a consumer installs it: in Node it must load and
      # keep the backends the web build registers (xtask/src/npm.rs).
      - run: cargo xtask npm
      - run: cargo xtask npm-smoke
      # The package this pull request builds, to try its engine before it merges (the playground does): one artifact
      # per head commit, `engine-npm-<head sha>`, kept 7 days. Built, as every job here, from GitHub's merge of that
      # head into the base. RELEASING.md, "A pull request's package".
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: engine-npm-${{ github.event.pull_request.head.sha || github.sha }}
          path: target/npm/*.tgz
          retention-days: 7
          if-no-files-found: error
          overwrite: true

  # The wasm32 tests again, in a headless Chrome, with those that need a page (OPFS, an HTTP server) that Node skips
  # (`cargo xtask test-browser`). Chrome and ChromeDriver are pinned to one Chrome for Testing version.
  test-browser:
    name: Test wasm (headless Chrome)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup
        with:
          wasm: true
      - id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: "155.0.8059.39"
          install-chromedriver: true
      - run: cargo xtask test-browser
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
          CHROMEDRIVER: ${{ steps.chrome.outputs.chromedriver-path }}

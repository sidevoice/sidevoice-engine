name: ci

# Every pull request: format and Clippy (Clippy on macOS too, the only place the MLX backend compiles), the tests on
# every native target and on wasm32 in Node, and the npm package `@sidevoice/engine` built and installed as a
# consumer installs it (`cargo xtask npm`, `npm-smoke`), publishing nothing: what passes here is what merging
# publishes (release.yml). Which backends a build contains is checked here, per target (src/backend/tests.rs, and in the
# packaged build by npm-smoke); whether they work on a given machine is each backend's probe(). Models run for real
# on every native target through the sherpa-onnx backend (test-inference; whisper.cpp runs them in the e2e workflow),
# and what linking each backend's engine costs is measured (link-size).
on:
  # Into any branch, so a pull request stacked on another is checked before its base merges.
  pull_request:
  # release-please.yml dispatches it on the release PR, whose pushes start no workflow.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup
        with:
          wasm: true
      - run: cargo fmt --check
      - run: cargo fmt --manifest-path xtask/Cargo.toml --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      # Without the default `sherpa-onnx` and `whisper-cpp` features: the backends, and the libraries they link, left out.
      - run: cargo clippy --locked --all-targets --no-default-features -- -D warnings
      - run: cargo clippy --locked --all-targets --target wasm32-unknown-unknown -- -D warnings
      - run: cargo clippy --locked --manifest-path xtask/Cargo.toml --all-targets -- -D warnings

  # A second lint only because the MLX backend compiles on macOS on Apple silicon alone (src/backends/mlx.rs): Clippy
  # on Linux never sees it. Everything else is linted once, above.
  lint-macos:
    name: Lint (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup
      - run: cargo clippy --locked --all-targets -- -D warnings

  test-native:
    name: Test native (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: macos-aarch64, runner: macos-14 }
          - { target: linux-x86_64, runner: ubuntu-24.04 }
          - { target: linux-aarch64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup
      # --include-ignored: the tests that need the network (a real download through NativeHost) run here too; the ones
      # that run real models have a job of their own, below.
      - run: cargo test --locked -- --include-ignored --skip sherpa_onnx::inference_tests

  # Real models through the sherpa-onnx backend: Whisper transcribes, Kokoro speaks, and Whisper hears Kokoro back
  # (src/backend/implementations/sherpa_onnx/inference_tests.rs), on the library the build links. The tests install the
  # models through the engine's installer and NativeHost, checked by digest; the cache keeps its directory, keyed by
  # the file that pins them.
  test-inference:
    name: Test inference (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: macos-aarch64, runner: macos-14 }
          - { target: linux-x86_64, runner: ubuntu-24.04 }
          - { target: linux-aarch64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/test-models
          key: test-models-${{ matrix.target }}-${{ hashFiles('src/backend/implementations/sherpa_onnx/inference_tests.json') }}
      - run: cargo test --locked --lib sherpa_onnx::inference_tests -- --ignored --nocapture --test-threads=1
        env:
          SIDEVOICE_TEST_MODELS: ${{ runner.temp }}/test-models

  # What linking each backend's engine costs an app: the smallest program using the engine, built in release mode and
  # stripped, with no linked backend, with `sherpa-onnx` or `whisper-cpp` alone, and with both, the default
  # (xtask/src/link_size.rs). The sizes go to the job's summary.
  link-size:
    name: Link size (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: macos-aarch64, runner: macos-14 }
          - { target: linux-x86_64, runner: ubuntu-24.04 }
          - { target: linux-aarch64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup
      - run: cargo xtask link-size

  test-wasm:
    name: Test wasm (Node, npm package)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup
        with:
          wasm: true
      # The build tooling's own tests (xtask/), then the engine's tests compiled to wasm32 and run in Node by
      # wasm-bindgen-test-runner (the runner in .cargo/config.toml; doctests cannot run on wasm32).
      - run: cargo test --locked --manifest-path xtask/Cargo.toml
      - run: cargo test --locked --target wasm32-unknown-unknown --lib
      # The npm package, installed into a temporary directory as a consumer installs it: in Node it must load and
      # keep the backends the web build registers (xtask/src/npm.rs).
      - run: cargo xtask npm
      - run: cargo xtask npm-smoke

  # TEMPORARY: diagnose the abort of sherpa-onnx on linux-x86_64 when whisper.cpp is linked too.
  debug-link:
    name: Debug link (linux-x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/test-models
          key: test-models-linux-x86_64-${{ hashFiles('src/backend/implementations/sherpa_onnx/inference_tests.json') }}
      - name: Duplicate symbols
        shell: bash
        run: |
          set -uo pipefail
          cargo test --locked --lib --no-run 2>&1 | tail -3
          out=$(ls -d target/debug/build/whisper-rs-sys-*/out | head -1)
          find "$out" -name '*.a' | tee /tmp/wlibs
          ls target/sherpa-onnx-prebuilt/*/lib/*.a | tee /tmp/slibs
          sym() { xargs nm -g --defined-only 2>/dev/null | awk 'NF==3 {print $3" "$2}' | sort -u; }
          sym < /tmp/wlibs > /tmp/wsyms; sym < /tmp/slibs > /tmp/ssyms
          cut -d' ' -f1 /tmp/wsyms | sort -u > /tmp/wn; cut -d' ' -f1 /tmp/ssyms | sort -u > /tmp/sn
          echo "whisper defs: $(wc -l < /tmp/wn), sherpa defs: $(wc -l < /tmp/sn)"
          comm -12 /tmp/wn /tmp/sn > /tmp/both
          echo "shared: $(wc -l < /tmp/both)"
          while read -r name; do
            echo "$(echo "$name" | c++filt) | whisper: $(grep "^$name " /tmp/wsyms | cut -d' ' -f2 | tr '\n' ' ')| sherpa: $(grep "^$name " /tmp/ssyms | cut -d' ' -f2 | tr '\n' ' ')"
          done < /tmp/both
          true
      - name: Backtrace
        shell: bash
        env:
          SIDEVOICE_TEST_MODELS: ${{ runner.temp }}/test-models
        if: always()
        run: |
          sudo apt-get install -y -q gdb > /dev/null
          bin=$(ls -t target/debug/deps/sidevoice_engine-* | grep -v '\.d$' | head -1)
          gdb -batch -ex run -ex bt --args "$bin" sherpa_onnx::inference_tests --ignored --test-threads=1 --nocapture 2>&1 | tail -60

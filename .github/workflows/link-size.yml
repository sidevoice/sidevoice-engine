name: link-size

# What linking sherpa-onnx costs an app: the smallest program using the engine, built in release mode and stripped,
# with and without the `sherpa-onnx` feature (xtask/src/link_size.rs); the sizes go to each job's summary. Not on
# every pull request: on demand, and on those that change what is linked (the dependencies, sherpa-onnx's pinned
# libraries, or the measurement itself), which also check that xtask/sherpa-onnx-libs.json is what `cargo xtask
# sherpa-libs --pin` writes for the version Cargo.toml pins.
on:
  # Into any branch, so a pull request stacked on another is checked before its base merges.
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - xtask/sherpa-onnx-libs.json
      - xtask/src/link_size.rs
      - xtask/src/link_size/**
      - xtask/src/sherpa_libs.rs
      - .github/workflows/link-size.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: link-size-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pinned:
    name: sherpa-onnx libraries pinned
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup
      - run: cargo xtask sherpa-libs --check
        env:
          GITHUB_TOKEN: ${{ github.token }}

  link-size:
    name: Link size (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: macos-aarch64, runner: macos-14 }
          - { target: linux-x86_64, runner: ubuntu-24.04 }
          - { target: linux-aarch64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup
      - run: cargo xtask link-size
      - run: cargo xtask sherpa-libs --linked

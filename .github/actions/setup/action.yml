name: Set up the Rust build
description: >-
  Installs the pinned Rust toolchain (with rustfmt and Clippy) and restores the build cache. With `wasm: true`, also
  the wasm32 target and the wasm-bindgen CLI (`wasm-bindgen`, and `wasm-bindgen-test-runner`, the wasm32 tests'
  runner in .cargo/config.toml).

inputs:
  wasm:
    description: Whether to set up the wasm32 build too.
    default: "false"

runs:
  using: composite
  steps:
    - name: Toolchain
      shell: bash
      env:
        RUST_VERSION: "1.98.1"
        WASM: ${{ inputs.wasm }}
      run: |
        set -euo pipefail
        rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy --component rustfmt
        if [ "$WASM" = true ]; then rustup target add --toolchain "$RUST_VERSION" wasm32-unknown-unknown; fi
        echo "RUSTUP_TOOLCHAIN=$RUST_VERSION" >> "$GITHUB_ENV"
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        key: ${{ inputs.wasm == 'true' && 'wasm' || '' }}
    # sherpa-onnx-sys downloads its static libraries into target/sherpa-onnx-prebuilt and links them from there. The
    # cache restores that directory pruned (rust-cache keeps build, deps and .fingerprint), and with it the build
    # script's output, so the script would neither run again nor download what is missing: forget both, so that it
    # runs and fetches them.
    - name: Forget sherpa-onnx-sys's build output
      shell: bash
      run: rm -rf target/sherpa-onnx-prebuilt target/*/build/sherpa-onnx-sys-* target/*/.fingerprint/sherpa-onnx-sys-*
    # The CLI must be the version of the `wasm-bindgen` crate in Cargo.lock: bump both together. install-action
    # checks the release binary against the SHA-256 in its own manifest; no fallback to building it from source.
    # After the cache, so that no binary the cache restores stands in for this one.
    - if: inputs.wasm == 'true'
      uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
      with:
        tool: wasm-bindgen@0.2.129
        fallback: none

name: Set up the Rust build
description: >-
  Installs the pinned Rust toolchain (with rustfmt and Clippy), restores the build cache and fetches sherpa-onnx's
  prebuilt libraries (`cargo xtask sherpa-libs`). With `wasm: true`, also the wasm32 target and the wasm-bindgen CLI
  (`wasm-bindgen`, and `wasm-bindgen-test-runner`, the wasm32 tests' runner in .cargo/config.toml). With `android: true`,
  the Android targets, the NDK and cargo-ndk (`cargo xtask android-build`). With `ios: true`, the iOS targets
  (`cargo xtask ios-build`, on macOS). On Linux and Windows, also what whisper.cpp's Vulkan backend needs to build
  (Cargo.toml: the `vulkan` feature of whisper-rs): the Vulkan headers and `glslc` on Linux x86_64 (apt), the LunarG Vulkan SDK
  on Windows (`VULKAN_SDK`); nothing on macOS, whose whisper.cpp runs on Metal. No GPU is needed to build or test: the
  tests run on the CPU.

inputs:
  wasm:
    description: Whether to set up the wasm32 build too.
    default: "false"
  android:
    description: Whether to set up the Android build too.
    default: "false"
  ios:
    description: Whether to set up the iOS build too (on macOS).
    default: "false"

runs:
  using: composite
  steps:
    - name: Toolchain
      shell: bash
      env:
        RUST_VERSION: "1.98.1"
        WASM: ${{ inputs.wasm }}
      run: |
        set -euo pipefail
        rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy --component rustfmt
        if [ "$WASM" = true ]; then rustup target add --toolchain "$RUST_VERSION" wasm32-unknown-unknown; fi
        echo "RUSTUP_TOOLCHAIN=$RUST_VERSION" >> "$GITHUB_ENV"
    # whisper.cpp's Vulkan shaders are generated by a tool that ggml builds in a nested CMake project (an
    # ExternalProject), and on Windows that needs two things of the environment. A generator other than Visual Studio's,
    # CMake's default there: MSBuild runs the nested project's configure and install steps at the same time (`Not a
    # file: .../cmake_install.cmake`) and its file tracker fails on files that deep (FTK1011); Ninja has neither problem,
    # and the `cmake` crate takes it from `CMAKE_GENERATOR` and the compiler's environment from the Visual Studio
    # installation. And a short target directory: CMake's compiler check there runs `cl.exe` on a path about 220
    # characters below it, and `cl.exe` fails past 260 (`C1083`), which a hosted runner's checkout
    # (`D:\a\<repo>\<repo>\target`) already is.
    - if: runner.os == 'Windows'
      shell: bash
      run: |
        echo "CMAKE_GENERATOR=Ninja" >> "$GITHUB_ENV"
        echo 'CARGO_TARGET_DIR=D:\t' >> "$GITHUB_ENV"
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        # GGML_NATIVE=OFF lives in .cargo/config.toml; never restore a CPU-specific ggml cache.
        key: ggml-portable-vulkan-${{ inputs.wasm == 'true' && 'wasm' || 'native' }}
    # sherpa-onnx's prebuilt static libraries, which the `sherpa-onnx` crate links: fetched once by `cargo xtask
    # sherpa-libs`, checked against the digests in xtask/sherpa-onnx-libs.json, and kept outside target/, which
    # rust-cache prunes. The build links them through SHERPA_ONNX_LIB_DIR, which the command exports, so
    # sherpa-onnx-sys's build script downloads nothing.
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/sidevoice-engine/sherpa-onnx
        key: sherpa-onnx-libs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('xtask/sherpa-onnx-libs.json') }}
    - name: sherpa-onnx's libraries
      shell: bash
      run: cargo run --quiet --locked --manifest-path xtask/Cargo.toml -- sherpa-libs
    # The CLI must be the version of the `wasm-bindgen` crate in Cargo.lock: bump both together. install-action
    # checks the release binary against the SHA-256 in its own manifest; no fallback to building it from source.
    # After the cache, so that no binary the cache restores stands in for this one.
    - if: inputs.wasm == 'true'
      uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
      with:
        tool: wasm-bindgen@0.2.129
        fallback: none
    # The NDK is installed by version rather than taken from the runner image, which carries whichever it carries; r28 or
    # later makes the libraries 16 KB page aligned. cargo-ndk is built from its published crate, as it is not among
    # install-action's tools; rust-cache restores the binary.
    - if: inputs.android == 'true'
      shell: bash
      env:
        NDK_VERSION: "29.0.14206865"
        CARGO_NDK_VERSION: "4.1.2"
      run: |
        set -euo pipefail
        rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
        cargo install cargo-ndk --locked --version "$CARGO_NDK_VERSION"
    - if: inputs.ios == 'true'
      shell: bash
      run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim
    # whisper.cpp's Vulkan backend (Linux and Windows builds on x86_64, whisper-rs's `vulkan` feature; nothing on Linux aarch64) needs the Vulkan headers and
    # `glslc`, the shader compiler, at build time; the loader and a GPU are only needed to run on one, never here.
    - if: runner.os == 'Linux' && runner.arch == 'X64' && inputs.android != 'true'
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libvulkan-dev glslc
    # The SDK version is pinned, as the Rust toolchain is. The action exports VULKAN_SDK, which whisper-rs-sys's build
    # script requires on Windows; the SDK folder is cached, as the installer is large.
    - if: runner.os == 'Windows'
      uses: jakoch/install-vulkan-sdk-action@7fe84289ddbf750f7eff9f8e4588e600e1dd06c8 # v1.8.1
      with:
        vulkan_version: 1.4.321.1
        cache: true
        stripdown: true

name: Set up the Rust build
description: >-
  Installs the pinned Rust toolchain (with rustfmt and Clippy), restores the build cache and fetches sherpa-onnx's
  prebuilt libraries (`cargo xtask sherpa-libs`). With `wasm: true`, also the wasm32 target and the wasm-bindgen CLI
  (`wasm-bindgen`, and `wasm-bindgen-test-runner`, the wasm32 tests' runner in .cargo/config.toml). With `android: true`,
  the Android targets, the NDK and cargo-ndk (`cargo xtask android-build`).

inputs:
  wasm:
    description: Whether to set up the wasm32 build too.
    default: "false"
  android:
    description: Whether to set up the Android build too.
    default: "false"

runs:
  using: composite
  steps:
    - name: Toolchain
      shell: bash
      env:
        RUST_VERSION: "1.98.1"
        WASM: ${{ inputs.wasm }}
      run: |
        set -euo pipefail
        rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy --component rustfmt
        if [ "$WASM" = true ]; then rustup target add --toolchain "$RUST_VERSION" wasm32-unknown-unknown; fi
        echo "RUSTUP_TOOLCHAIN=$RUST_VERSION" >> "$GITHUB_ENV"
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        # GGML_NATIVE=OFF lives in .cargo/config.toml; never restore a CPU-specific ggml cache.
        key: ggml-portable-${{ inputs.wasm == 'true' && 'wasm' || 'native' }}
    # sherpa-onnx's prebuilt static libraries, which the `sherpa-onnx` crate links: fetched once by `cargo xtask
    # sherpa-libs`, checked against the digests in xtask/sherpa-onnx-libs.json, and kept outside target/, which
    # rust-cache prunes. The build links them through SHERPA_ONNX_LIB_DIR, which the command exports, so
    # sherpa-onnx-sys's build script downloads nothing.
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/sidevoice-engine/sherpa-onnx
        key: sherpa-onnx-libs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('xtask/sherpa-onnx-libs.json') }}
    - name: sherpa-onnx's libraries
      shell: bash
      run: cargo run --quiet --locked --manifest-path xtask/Cargo.toml -- sherpa-libs
    # The CLI must be the version of the `wasm-bindgen` crate in Cargo.lock: bump both together. install-action
    # checks the release binary against the SHA-256 in its own manifest; no fallback to building it from source.
    # After the cache, so that no binary the cache restores stands in for this one.
    - if: inputs.wasm == 'true'
      uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
      with:
        tool: wasm-bindgen@0.2.129
        fallback: none
    # The NDK is installed by version rather than taken from the runner image, which carries whichever it carries; r28 or
    # later makes the libraries 16 KB page aligned. cargo-ndk is built from its published crate, as it is not among
    # install-action's tools; rust-cache restores the binary.
    - if: inputs.android == 'true'
      shell: bash
      env:
        NDK_VERSION: "29.0.14206865"
        CARGO_NDK_VERSION: "4.1.2"
      run: |
        set -euo pipefail
        rustup target add aarch64-linux-android x86_64-linux-android
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
        cargo install cargo-ndk --locked --version "$CARGO_NDK_VERSION"
